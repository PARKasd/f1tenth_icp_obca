kinematic_mapping:
  ros__parameters:
    # localization YAML과 같은 E2 설정 세대 표식. 노드 기대값과 다르면 기동 실패.
    config_schema_version: 20260824
    use_sim_time: false

    # Offline mapping inputs/outputs
    bag_path: ""
    lidar_topic: /scan
    odom_topic: /odom
    output_path: map.kissmap
    tf_topic: /tf
    tf_static_topic: /tf_static
    base_frame: base_link

    # Kinematic-ICP tuning (same values as the localization node)
    max_range: 30.0
    min_range: 0.1
    voxel_size: 1.0
    max_points_per_voxel: 20
    use_adaptive_threshold: true
    fixed_threshold: 1.0
    max_num_iterations: 30
    convergence_criterion: 0.001
    max_num_threads: 4
    use_adaptive_odometry_regularization: true
    fixed_regularization: 0.0
    deskew: true

    # Keep these equal to localization when building a map from a fast-driving
    # bag. Existing low-speed occupancy/SLAM-derived maps need no regeneration.
    tilt_compensation_enable: true
    roll_gradient_rad_per_mps2: 0.0270
    pitch_gradient_rad_per_mps2: 0.0
    tilt_max_angle_rad: 0.26
    tilt_max_point_height_m: 0.0
