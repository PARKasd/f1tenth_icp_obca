/**:
  ros__parameters:
    # Standard gym bridge stamps messages with wall time and does not publish /clock.
    # Enable use_sim_time only for a bridge using /clock for every sensor and TF stamp.
    use_sim_time: false
    map_frame: map
    base_frame: ego_racecar/base_link
    scan_topic: /scan
    drive_topic: /drive
kinematic_localization:
  ros__parameters:
    lidar_topic: /scan
    odom_topic: /ego_racecar/odom
    odom_frame: ego_racecar/odom
    # Gym already owns the ground-truth vehicle TF tree.
    publish_map_odom_tf: false
    map_output_file: sim_slam_map.kissmap
